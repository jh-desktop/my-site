<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>낙찰 가격 도출 시뮬레이터</title>
<style>
  :root{
    --ink:#12181f; --paper:#f6f4ee; --panel:#fffdf8; --line:#d8d2c4;
    --muted:#6b7280; --accent:#1f5f4f; --accent2:#b45309; --hot:#9a2b2b;
    --grid:#eceae2;
    --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
  header h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px;}
  header p{margin:0;color:var(--muted);font-size:13px;}
  .layout{display:grid;grid-template-columns:340px 1fr;gap:22px;margin-top:22px;}
  @media(max-width:880px){.layout{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 14px;font-weight:700;}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:600;}
  label:first-of-type{margin-top:0}
  input[type=number],input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);font-size:14px;background:#fff;}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hint{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;}
  button{cursor:pointer;font-family:var(--sans);font-weight:600;border-radius:7px;border:1px solid transparent;}
  .btn-run{width:100%;margin-top:18px;padding:12px;background:var(--accent);color:#fff;font-size:15px;border:none;}
  .btn-run:hover{background:#174a3d}
  .btn-sub{padding:7px 12px;font-size:12px;background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-sub:hover{background:var(--grid)}
  .btn-danger{color:var(--hot);border-color:#e3c9c9;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .stat .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:3px;letter-spacing:-.01em;}
  .stat .v.small{font-size:15px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .toolbar .sp{flex:1}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;}
  th{position:sticky;top:0;background:var(--panel);text-align:right;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;z-index:1;font-weight:700;}
  th:first-child,td:first-child{text-align:left;}
  .tbl-scroll{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel);}
  tr.picked td{background:#eaf3ef;}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;background:#eef;color:var(--accent);font-family:var(--sans);font-weight:700;letter-spacing:.03em;}
  .tag.win{background:#e7f2ec;color:var(--accent);}
  .tag.real{background:#fbeee0;color:var(--accent2);}
  details{margin-top:14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:0 14px;}
  summary{cursor:pointer;font-weight:600;padding:12px 0;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px;}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸";color:var(--accent);transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  details .body{padding:0 0 14px}
  .num-pill{display:inline-block;font-family:var(--mono);font-size:12px;padding:3px 8px;margin:3px;border-radius:6px;background:#fff;border:1px solid var(--line);}
  .num-pill.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);}
  .empty .big{font-size:40px;opacity:.35;margin-bottom:8px}
  textarea{width:100%;min-height:70px;padding:9px;border:1px solid var(--line);border-radius:7px;font-family:var(--mono);font-size:12px;background:#fff;resize:vertical;}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:12px;}
  .seg button{flex:1;padding:8px;background:#fff;border:none;border-radius:0;font-size:12px;color:var(--muted);}
  .seg button.active{background:var(--accent);color:#fff;}
  .mini{font-size:11px;color:var(--muted);margin:10px 0 2px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  code.inline{background:var(--grid);padding:1px 5px;border-radius:4px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>낙찰 가격 도출 시뮬레이터</h1>
    <p>복수예비가격 15개 추첨 → 4개 평균 → 기준가격 산출 → 최저 입찰 낙찰. 검증용 시뮬레이션 도구.</p>
  </header>

  <div class="layout">
    <!-- LEFT: controls -->
    <div>
      <div class="card">
        <h2>입력값</h2>

        <label>기본금액 (원)</label>
        <input type="text" id="base" value="10,000,000" inputmode="numeric">
        <div class="hint">낙찰 가격 산출의 기준이 되는 금액.</div>

        <label>산출 범위 (%)</label>
        <div class="row">
          <input type="number" id="lo" value="98" step="0.1">
          <input type="number" id="hi" value="102" step="0.1">
        </div>
        <div class="hint">기본 98 ~ 102. 예: 97~103, 98.5~101.5 등 자유 설정.</div>

        <div class="row">
          <div>
            <label>예비가격 개수</label>
            <input type="number" id="poolN" value="15" min="2">
          </div>
          <div>
            <label>추첨 개수</label>
            <input type="number" id="pickN" value="4" min="1">
          </div>
        </div>
        <div class="hint">국가계약 기본은 15개 중 4개.</div>

        <label>시행 횟수 (한 번에 뽑을 데이터 수)</label>
        <input type="number" id="trials" value="1" min="1" max="100000">
        <div class="hint">여러 차수를 한 번에 생성해 통계로 볼 수 있음.</div>

        <label>소수점 자리 (예비가격)</label>
        <input type="number" id="dp" value="5" min="0" max="8">

        <button class="btn-run" id="run">시뮬레이션 실행</button>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>실제 데이터 반영</h2>
        <div class="seg" id="realMode">
          <button data-m="off" class="active">미사용</button>
          <button data-m="rate">낙찰율(%)</button>
          <button data-m="price">낙찰가(원)</button>
        </div>
        <div id="realBox" style="display:none">
          <div class="hint" id="realHint"></div>
          <textarea id="realData" placeholder="한 줄에 하나씩 입력"></textarea>
          <div class="hint">실제 차수의 <strong>기준가격 낙찰율</strong> 또는 <strong>낙찰가</strong>를 붙여넣으면, 시뮬레이션 분포와 겹쳐서 비교합니다.</div>
        </div>
      </div>
    </div>

    <!-- RIGHT: results -->
    <div>
      <div id="stats" class="stat-grid" style="display:none"></div>

      <div class="toolbar" id="viewToolbar" style="display:none">
        <div class="seg" style="margin:0;max-width:260px" id="viewMode">
          <button data-v="each" class="active">개별 차수</button>
          <button data-v="merged">합쳐 보기</button>
        </div>
        <span class="sp"></span>
        <button class="btn-sub" id="exportCsv">CSV 내보내기</button>
        <button class="btn-sub btn-danger" id="clearAll">초기화</button>
      </div>

      <div id="output">
        <div class="card"><div class="empty"><div class="big">◷</div>왼쪽에서 값을 설정하고 <strong>시뮬레이션 실행</strong>을 눌러주세요.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=(n,d=0)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';

let runs=[];
let realMode='off';
let viewMode='each';

$('base').addEventListener('input',e=>{
  const v=e.target.value.replace(/[^\d]/g,'');
  e.target.value=v?Number(v).toLocaleString('ko-KR'):'';
});

$('realMode').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  realMode=b.dataset.m;
  [...$('realMode').children].forEach(x=>x.classList.toggle('active',x===b));
  $('realBox').style.display = realMode==='off'?'none':'block';
  $('realHint').textContent = realMode==='rate'
    ? '기준가격 = 기본금액 × (낙찰율/100). 예: 99.53'
    : realMode==='price'
    ? '실제 기준가격(원). 예: 9,953,000' : '';
});
$('viewMode').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  viewMode=b.dataset.v;
  [...$('viewMode').children].forEach(x=>x.classList.toggle('active',x===b));
  render();
});

function comb(n,r){let c=1;for(let i=0;i<r;i++)c=c*(n-i)/(i+1);return Math.round(c);}

function samplePick(n,r){
  const idx=[...Array(n).keys()];
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,r).sort((a,b)=>a-b);
}

function runOnce(cfg){
  const {base,lo,hi,poolN,pickN,dp}=cfg;
  const f=Math.pow(10,dp);
  const pool=Array.from({length:poolN},()=>{
    const r=lo+Math.random()*(hi-lo);
    return Math.round(r*f)/f;
  });
  const picks=samplePick(poolN,pickN);
  const avg=picks.reduce((s,i)=>s+pool[i],0)/pickN;
  const basePrice=base*avg/100;
  return {pool,picks,avg,basePrice};
}

$('run').addEventListener('click',()=>{
  const base=Number($('base').value.replace(/[^\d]/g,''));
  const lo=parseFloat($('lo').value), hi=parseFloat($('hi').value);
  const poolN=parseInt($('poolN').value), pickN=parseInt($('pickN').value);
  const trials=Math.min(parseInt($('trials').value)||1,100000);
  const dp=Math.max(0,Math.min(8,parseInt($('dp').value)||5));
  if(!base){alert('기본금액을 입력하세요.');return;}
  if(hi<=lo){alert('산출 범위 상한이 하한보다 커야 합니다.');return;}
  if(pickN>poolN){alert('추첨 개수는 예비가격 개수 이하여야 합니다.');return;}

  const cfg={base,lo,hi,poolN,pickN,dp,trials};
  const batch=[];
  for(let t=0;t<trials;t++) batch.push(runOnce(cfg));
  runs.push({cfg,batch,ts:Date.now()});
  render();
});

$('clearAll').addEventListener('click',()=>{if(confirm('모든 시뮬레이션 결과를 지웁니다.')){runs=[];render();}});

function realBasePrices(base){
  if(realMode==='off') return [];
  const raw=$('realData').value.split(/[\n,]+/).map(s=>s.replace(/[^\d.]/g,'')).filter(Boolean).map(Number);
  if(realMode==='rate') return raw.map(r=>base*r/100);
  return raw;
}

function allBasePrices(){
  return runs.flatMap(r=>r.batch.map(b=>b.basePrice));
}

function render(){
  if(runs.length===0){
    $('stats').style.display='none';
    $('viewToolbar').style.display='none';
    $('output').innerHTML='<div class="card"><div class="empty"><div class="big">◷</div>왼쪽에서 값을 설정하고 <strong>시뮬레이션 실행</strong>을 눌러주세요.</div></div>';
    return;
  }
  $('stats').style.display='grid';
  $('viewToolbar').style.display='flex';

  const prices=allBasePrices();
  const base=runs[runs.length-1].cfg.base;
  const mean=prices.reduce((a,b)=>a+b,0)/prices.length;
  const min=Math.min(...prices), max=Math.max(...prices);
  const sd=Math.sqrt(prices.reduce((s,p)=>s+(p-mean)**2,0)/prices.length);
  const cfg=runs[runs.length-1].cfg;

  $('stats').innerHTML=`
    <div class="stat"><div class="k">총 시행 수</div><div class="v">${fmt(prices.length)}</div></div>
    <div class="stat"><div class="k">기준가격 평균</div><div class="v small">${won(mean)}</div></div>
    <div class="stat"><div class="k">최솟값 / 최곳값</div><div class="v small">${won(min)} / ${won(max)}</div></div>
    <div class="stat"><div class="k">표준편차 · 조합수</div><div class="v small">${won(sd)} · ${comb(cfg.poolN,cfg.pickN)}<span style="font-size:11px;color:var(--muted)"> (${cfg.poolN}C${cfg.pickN})</span></div></div>
  `;

  const reals=realBasePrices(base);
  let realBlock='';
  if(reals.length){
    const rMean=reals.reduce((a,b)=>a+b,0)/reals.length;
    const diff=rMean-mean;
    realBlock=`<details open><summary><span class="tag real">실제 데이터 비교</span> 실제 ${reals.length}건 vs 시뮬</summary><div class="body">
      <table><tr><th>구분</th><th>건수</th><th>평균 기준가격</th></tr>
      <tr><td>시뮬레이션</td><td>${fmt(prices.length)}</td><td>${won(mean)}</td></tr>
      <tr><td>실제</td><td>${reals.length}</td><td>${won(rMean)}</td></tr>
      <tr class="picked"><td>차이 (실제−시뮬)</td><td>—</td><td>${(diff>=0?'+':'')}${won(diff)}</td></tr>
      </table>
      <div class="hint" style="margin-top:8px">시뮬 분포 대비 실제 기준가격이 어디에 위치하는지 비교합니다. 실제 평균이 시뮬 평균과 크게 다르면 실제 추첨이 균등하지 않거나 범위 설정이 다를 수 있습니다.</div>
    </div></details>`;
  }

  if(viewMode==='merged'){
    const bins=20;
    const bw=(max-min)/bins||1;
    const hist=Array(bins).fill(0);
    prices.forEach(p=>{let i=Math.min(bins-1,Math.floor((p-min)/bw));hist[i]++;});
    const hmax=Math.max(...hist);
    const rHist=Array(bins).fill(0);
    reals.forEach(p=>{if(p>=min&&p<=max){let i=Math.min(bins-1,Math.floor((p-min)/bw));rHist[i]++;}});
    let rows='';
    for(let i=0;i<bins;i++){
      const lo=min+i*bw, hi=lo+bw;
      const w=(hist[i]/hmax*100)||0;
      const rMark=rHist[i]?`<span class="tag real" style="margin-left:6px">실제 ${rHist[i]}</span>`:'';
      rows+=`<tr><td>${won(lo)} ~ ${won(hi)}</td>
        <td style="text-align:left;width:55%"><div style="display:inline-block;height:12px;width:${w}%;min-width:2px;background:var(--accent);border-radius:3px"></div> ${hist[i]}${rMark}</td></tr>`;
    }
    $('output').innerHTML=`<div class="card"><h2>합쳐 보기 · 기준가격 분포</h2>
      <div class="tbl-scroll" style="max-height:none"><table><tr><th>기준가격 구간</th><th style="text-align:left">빈도</th></tr>${rows}</table></div>
      </div>${realBlock}`;
    return;
  }

  const last=runs[runs.length-1];
  const showN=Math.min(last.batch.length,1000);
  let rows='';
  last.batch.slice(0,showN).forEach((b,i)=>{
    const picksStr=b.picks.map(p=>`#${p+1}`).join(' ');
    rows+=`<tr><td>${i+1}</td><td>${b.avg.toFixed(cfg.dp)}</td><td>${won(b.basePrice)}</td><td style="text-align:left;color:var(--muted)">${picksStr}</td></tr>`;
  });

  const first=last.batch[0];
  let poolPills=first.pool.map((v,i)=>`<span class="num-pill ${first.picks.includes(i)?'on':''}">#${i+1} ${v.toFixed(cfg.dp)}</span>`).join('');

  $('output').innerHTML=`
    <div class="card">
      <h2>차수별 기준가격 · 최근 시행 (${fmt(showN)}${last.batch.length>showN?' / '+fmt(last.batch.length):''}건)</h2>
      <div class="tbl-scroll"><table>
        <tr><th>차수</th><th>추첨 평균(%)</th><th>기준가격</th><th style="text-align:left">추첨 번호</th></tr>
        ${rows}
      </table></div>
      <details style="margin-top:14px"><summary>1차수 예비가격 ${cfg.poolN}개 상세 <span class="tag win">추첨 ${cfg.pickN}개 강조</span></summary>
        <div class="body">${poolPills}
        <div class="hint" style="margin-top:8px">강조된 ${cfg.pickN}개의 평균 = <code class="inline">${first.avg.toFixed(cfg.dp)}%</code> → 기준가격 <code class="inline">${won(first.basePrice)}</code></div></div>
      </details>
      <div class="hint" style="margin-top:12px"><strong>낙찰 규칙:</strong> 기준가격보다 1원이라도 낮은 투찰 중 <strong>가장 낮은 금액</strong>이 낙찰. 여기서는 차수별 기준가격을 산출합니다.</div>
    </div>
    ${realBlock}
  `;
}

$('exportCsv').addEventListener('click',()=>{
  if(!runs.length)return;
  let csv='시행배치,차수,추첨평균(%),기준가격(원),추첨번호\n';
  runs.forEach((r,ri)=>r.batch.forEach((b,bi)=>{
    csv+=`${ri+1},${bi+1},${b.avg.toFixed(r.cfg.dp)},${Math.round(b.basePrice)},"${b.picks.map(p=>p+1).join(' ')}"\n`;
  }));
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='nakchal_simulation.csv';a.click();
});
</script>
</body>
</html>
